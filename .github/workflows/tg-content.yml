# The channel's writer: every morning it checks how many posts are left in tg_content/posts and, when fewer than
# five days' worth remain, has Claude Code write the next week (tg_content/GUIDE.md is the brief), checks them with
# `python -m tg_channel queue` and commits them. Runs on the owner's Claude subscription: the repository secret
# CLAUDE_CODE_OAUTH_TOKEN comes from `claude setup-token` on any computer with Claude Code. Without it, it just exits.
name: Telegram channel writer

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Write a batch even if the queue is long enough"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tg-content
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      MODEL: ${{ vars.TG_WRITER_MODEL || 'opus' }}
      BATCH: "14"
      MIN_LEFT: "10"
    steps:
      - name: Wait for the Claude token
        if: env.CLAUDE_CODE_OAUTH_TOKEN == ''
        run: echo "CLAUDE_CODE_OAUTH_TOKEN is not set (run 'claude setup-token', add it in Settings > Secrets and variables > Actions); nothing to do."

      - uses: actions/checkout@v4
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''

      - uses: actions/setup-python@v5
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        with:
          python-version: "3.12"

      - name: Install
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: pip install "httpx>=0.27"

      - name: How many posts are left
        id: left
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: |
          mkdir -p state
          if git ls-remote --exit-code --heads origin tg-bot-state >/dev/null 2>&1; then
            git fetch -q --depth 1 origin tg-bot-state
            git show FETCH_HEAD:state.json > state/state.json
          fi
          left=$(python -m tg_channel queue --state state/state.json --left)
          echo "left=$left" >> "$GITHUB_OUTPUT"
          echo "$left posts left in the queue"

      - name: Write the next posts
        id: write
        if: env.CLAUDE_CODE_OAUTH_TOKEN != '' && (inputs.force || fromJSON(steps.left.outputs.left) < fromJSON(env.MIN_LEFT))
        run: |
          npm install -g @anthropic-ai/claude-code >/dev/null
          today=$(TZ=Europe/Kyiv date +%F)
          cat > "$RUNNER_TEMP/prompt.txt" <<EOF
          You write the next posts for the Ukrainian Telegram channel described in tg_content/GUIDE.md. Read the guide
          first and follow it exactly. Today is $today (Kyiv).
          1. Read the last 30 files in tg_content/posts so you do not repeat a topic, and see how the best ones are built.
          2. Write $BATCH new posts (one week, two a day) as new files continuing the numbering, in the rubric mix the
             guide gives, never two of the same rubric in a row. Do not change existing files.
          3. You may add one news post: only if WebSearch finds 3 to 5 notable AI news items from the last 7 days with
             official sources; link each source and give the post the header line date: (tomorrow's date).
          4. Run every prompt yourself and quote the real result. No numbers you did not verify in this session.
          5. Run: python -m tg_channel queue --state state/state.json and fix your files until it prints no ✗ line.
          Finish with one line per new file: its name and topic.
          EOF
          # the prompt goes first: --allowedTools takes every argument after it
          claude -p "$(cat "$RUNNER_TEMP/prompt.txt")" --model "$MODEL" --permission-mode dontAsk \
            --allowedTools "Read" "Glob" "Grep" "WebSearch" "WebFetch" \
              "Write(tg_content/posts/**)" "Edit(tg_content/posts/**)" "Bash(python -m tg_channel queue:*)"

      - name: Check and commit
        if: steps.write.outcome == 'success'
        run: |
          python -m tg_channel queue --state state/state.json
          if [ -n "$(git diff --name-only HEAD -- tg_content/posts)" ]; then
            echo "Existing posts were changed; not committing:"; git diff --stat HEAD -- tg_content/posts; exit 1
          fi
          git add tg_content/posts
          if git diff --cached --quiet; then echo "No new posts"; exit 0; fi
          git config user.name "tg-content"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "tg_content: next posts ($(git diff --cached --name-only | wc -l) files)"
          git push -q origin "HEAD:${GITHUB_REF_NAME}"
