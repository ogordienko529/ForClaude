# Competitor study for the Telegram channel: reads the public web preview (t.me/s/<name>) of the channels in
# tg_content/research/channels.txt, plus the channels they link to most (snowball), and saves every post's date,
# views, reactions, media and text to the tg-research branch (research/channels.json, research/summary.json).
# Run by hand: Actions > Telegram competitor study > Run workflow. No key needed.
name: Telegram competitor study

on:
  workflow_dispatch:
    inputs:
      pages:
        description: "Pages per channel (about 20 posts each)"
        default: "5"
      snowball:
        description: "Also study up to this many channels the list links to"
        default: "25"

permissions:
  contents: write

concurrency:
  group: tg-research
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install "httpx>=0.27"

      - name: Fetch the channels
        env:
          PAGES: ${{ inputs.pages || '5' }}
          SNOWBALL: ${{ inputs.snowball || '25' }}
        run: python -m tg_channel research --channels tg_content/research/channels.txt --pages "$PAGES" --snowball "$SNOWBALL" --out research

      - name: Save to the tg-research branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$(mktemp -d)"
          cp -r research "$dir/"
          cd "$dir"
          git init -q
          git config user.name "tg-research"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research
          git commit -q -m "competitor study $(date -u +%F)"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/tg-research
