# Ukrainian narration for the channel's short videos: Piper (open source, ukrainian_tts voice) on GitHub Actions,
# one WAV per line plus a Whisper intelligibility check, saved to the branch tts-<slug>. Run by hand with the path of
# a voice.json (see .github/scripts/tts_uk.py).
name: Ukrainian voice-over

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Path of the voice.json, e.g. tg_content/videos/v1-cv/voice.json"
        required: true

permissions:
  contents: write

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install "piper-tts==1.3.0" "faster-whisper>=1.1"

      - name: Synthesize and check
        env:
          SCRIPT: ${{ inputs.script }}
        run: |
          slug="$(basename "$(dirname "$SCRIPT")")"
          echo "slug=$slug" >> "$GITHUB_ENV"
          python .github/scripts/tts_uk.py "$SCRIPT" "out/$slug"

      - name: Save to the tts branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$(mktemp -d)"
          cp -r "out/$slug" "$dir/"
          cd "$dir"
          git init -q
          git config user.name "tts"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "voice-over $slug"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/tts-$slug"
