# Copy to ./config.toml or ~/.niche_research/config.toml (or point $NICHE_CONFIG at it).
# Any key you omit keeps its default. The API key is NOT read from here: use $YOUTUBE_API_KEY.

[paths]
db_path = "~/.niche_research/cache.db"
reports_dir = "reports"

[cache]
video_ttl_hours = 24
channel_ttl_hours = 168      # 7 days
search_ttl_hours = 24
retention_days = 30          # YouTube API policy: max 30. Older rows are purged on startup.

[quota]
daily_limit = 10000

[search]
region_code = "US"           # regionCode
relevance_language = "en"    # relevanceLanguage
max_results = 50             # per videoDuration bucket (short / medium / long)
published_within_days = 30
filter_by_audio_language = true   # relevanceLanguage is only a hint; drop videos with a different declared audio language

[shorts]
max_seconds = 180            # a Short is <= this AND has a vertical embed (height > width)
player_max_height = 720

[thresholds]
small_channel_max_subs = 50000     # "small channel" = at most this many subscribers
large_channel_min_subs = 100000
new_channel_max_age_days = 365
outlier_sub_floor = 100
min_sample_videos = 30
min_small_channel_hits = 5
sample_min_age_days = 7            # base-rate sample = newest uploads at least this old
new_channel_target = 20            # distinct new channels with hits for full count credit (log scale)
consistency_channel_target = 8     # distinct small channels with hits for full spread credit
# Paid-promotion filter: many views + near-zero engagement + channel avg views >> subscribers.
promo_min_views = 100000
promo_max_like_rate = 0.001        # < 0.1% likes per view
promo_max_comment_rate = 0.00005   # used when likes are hidden
promo_min_avg_views_per_sub = 20
max_ci_width = 25                  # 80% view-score interval wider than this => low confidence

# Bands map raw numbers to 0-100 (log scale for views). They were set from the backtest panel's
# 10th-90th percentiles (docs/CALIBRATION.md). Shorts views count every replay, so they differ per format.
[bands.shorts]
hit_views = 10000
velocity_views_per_day_low = 3         # median views/day of a typical upload -> 0
velocity_views_per_day_high = 1700     # -> 100
hit_share_high = 0.60                  # small-channel hit share that scores 100
small_views_low = 100000               # median views of small channels in the top results -> 0
small_views_high = 20000000
demand_views_low = 75000               # median views of the top results -> 0
demand_views_high = 13000000

[bands.long]
hit_views = 10000
velocity_views_per_day_low = 1
velocity_views_per_day_high = 100
hit_share_high = 0.30
small_views_low = 6000
small_views_high = 500000
demand_views_low = 13000
demand_views_high = 1200000

# final = (1 - monetization) * view_score + monetization * monetization_estimate.
# View weights per format, fitted on the temporal backtest (docs/CALIBRATION.md).
# Competition is reported but weighted 0: the backtest showed big channels signal demand, not a barrier.
# An old-style flat [weights] table (opportunity = 0.25, ...) is still accepted and applies to both formats.
[weights]
monetization = 0.15

[weights.shorts]
opportunity = 0.35
demand = 0.30
new_channel_proof = 0.15
velocity = 0.10
consistency = 0.10
competition = 0.0

[weights.long]
# Long-form: only opportunity and demand predicted later small-channel hit rates on the 14-niche
# panel; the other components are still reported, but carry no weight.
opportunity = 0.50
demand = 0.50
new_channel_proof = 0.0
velocity = 0.0
consistency = 0.0
competition = 0.0

# Hit-probability forecast: Beta-binomial shrinkage toward the panel's mean hit rate, widened by the
# month-to-month drift the backtest measured.
[forecast]
prior_strength = 10

[forecast.shorts]
prior_hit_rate = 0.48
drift_sd = 0.30

[forecast.long]
prior_hit_rate = 0.13
drift_sd = 0.055

# Monetization is an ESTIMATE (heuristic lookup), not API data. Override any part, e.g.:
# [monetization]
# high_keywords = ["finance", "invest", "insurance"]
# [monetization.category_tiers]
# "27" = "high"          # treat Education as high
# [monetization.long.high]
# score = 90
# rpm_range_usd = "$8-20+"
