[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-niche-research"
version = "0.1.0"
description = "YouTube niche research: find niches where small channels get 10k+ views fast. CLI + MCP server."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "mcp>=1.2",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
niche = "niche_core.__main__:main"
niche-mcp = "niche_mcp.server:main"

[tool.setuptools.packages.find]
include = ["niche_core*", "niche_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
