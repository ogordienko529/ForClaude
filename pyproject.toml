[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-niche-research"
version = "0.1.0"
description = "YouTube niche research: find niches where small channels get 10k+ views fast. CLI + MCP server."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "mcp>=1.2",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Sleep narration (python -m sleep_voice). Also needs ffmpeg on PATH.
voice = ["kokoro-onnx>=0.4", "soundfile>=0.12", "numpy>=1.24"]
# Local video maker (python -m content_agent). Also needs ffmpeg and Node.js 18+ on PATH.
agent = ["kokoro-onnx>=0.4", "soundfile>=0.12", "numpy>=1.24", "pillow>=10"]

[project.scripts]
niche = "niche_core.__main__:main"
niche-mcp = "niche_mcp.server:main"
sleep-voice = "sleep_voice.__main__:main"
content-agent = "content_agent.__main__:main"

[tool.setuptools.packages.find]
include = ["niche_core*", "niche_mcp*", "sleep_voice*", "content_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
